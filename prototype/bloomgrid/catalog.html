<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Bloomgrid — katalog komponentów r6</title>
<link rel="stylesheet" href="assets/bloomgrid.css">
<script src="assets/bloomgrid-rules.js"></script>
<script src="assets/bloomgrid-ui.js"></script>
<style>
body.cat-body{margin:0;background:#E4E2DA;font-family:var(--font);color:var(--ink)}
.bg-cat{max-width:1240px;margin:0 auto;padding:32px 24px 80px;background:var(--paper)}
.bg-cat.is-framed{box-shadow:0 0 0 1px var(--line),0 8px 30px rgba(40,34,20,.12)}
.bg-cat.is-narrow{padding:24px 8px 48px}
.bg-cat.is-narrow .cat-grid{grid-template-columns:minmax(0,1fr)}
.bg-cat.is-narrow .cat-spm-box{padding:14px 16px}
.cat-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:20px;border-bottom:2px solid var(--line)}
.cat-head h1{margin:0;font-size:30px;line-height:1.15}
.cat-head p{margin:6px 0 0;color:var(--ink-2);font-size:15px;max-width:66ch;text-wrap:pretty}
.cat-tools{display:flex;gap:6px;align-items:center;font-size:14px}
.cat-tools button{font:inherit;font-weight:700;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.cat-tools button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.cat-toc{display:flex;flex-wrap:wrap;gap:6px 14px;margin:16px 0 8px;font:13px var(--mono)}
.cat-toc a{color:var(--green-d)}
.cat-sec{padding:36px 0;border-bottom:1px solid var(--line);scroll-margin-top:12px}
.cat-sec > h2{margin:0;font:700 13px var(--mono);color:var(--green);letter-spacing:.02em}
.cat-sec > h3{margin:4px 0 6px;font-size:24px;line-height:1.2}
.cat-sem{margin:0 0 20px;color:var(--ink-2);font-size:16px;max-width:72ch;text-wrap:pretty}
.cat-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;align-items:start}
@media (max-width:900px){.cat-grid{grid-template-columns:minmax(0,1fr)}}
.cat-spec{margin:0;display:grid;gap:14px;font-size:14.5px;line-height:1.45}
.cat-spec dt{font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.cat-spec dd{margin:2px 0 0;text-wrap:pretty}
.cat-spec code,.cat-sem code,.cat-table code{font:12.5px var(--mono);background:#F0EBDC;padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.cat-spec ul{margin:2px 0 0;padding-left:18px}
.cat-specimens{display:flex;flex-wrap:wrap;gap:18px;min-width:0}
.cat-spm{display:flex;flex-direction:column;gap:8px;min-width:0;max-width:100%}
.cat-spm-box{position:relative;max-width:100%;min-width:0;overflow-x:auto;display:flex;align-items:center;justify-content:center;padding:22px;border-radius:14px;background:linear-gradient(180deg,#F3EAD3,#E2D6B8);min-height:96px}
.cat-spm-label{font:11.5px var(--mono);color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.cat-spm-label b{font-weight:700;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:1px 6px;border-radius:5px}
.cat-wide{flex-basis:100%;width:100%}.cat-wide .cat-spm-box{width:100%}
.cat-table{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.4}
.cat-table th,.cat-table td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.cat-table th{font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.cat-table-wrap{overflow-x:auto;max-width:100%}
.cat-swatch{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;text-align:center}
.cat-swatch-cell{--cell:56px}
.cat-cellrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cat-shapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px;width:100%}
.cat-shape{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:92px;padding:8px 4px;border-radius:12px;background:rgba(255,255,255,.6);font:10.5px var(--mono);color:var(--ink-2)}
.cat-dragbox{position:relative}
.cat-finger{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(34,48,30,.18);border:2px solid rgba(34,48,30,.45);transform:translate(-50%,-50%);pointer-events:none}
.cat-finger-label{position:absolute;transform:translate(-100%,0);font:11px var(--mono);color:var(--ink-2);white-space:nowrap}
.cat-demo{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px;border-radius:18px;background:linear-gradient(180deg,#F3EAD3,#E2D6B8)}
.cat-demo .bg-strip{width:var(--board-w)}
.cat-demo .bg-tray{width:min(100%,var(--tray-w))}
.cat-stack{display:flex;flex-direction:column;gap:12px;width:min(100%,361px)}
.cat-replay{margin-top:18px;font:700 13px var(--font);padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.cat-replay:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.cat-strip{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;width:100%}
.cat-cardbox{position:relative;width:100%;display:flex;justify-content:center}
.cat-note{font-size:13.5px;color:var(--ink-2);margin:8px 0 0}
</style>
</head>
<body class="cat-body">
<div class="bg-cat" id="cat"></div>
<script>
(async function () {
  'use strict';
  var h = BG.h, root = document.getElementById('cat');
  var fixtures, manifest;
  try { fixtures = await (await fetch('assets/fixtures.json', { cache: 'no-store' })).json(); manifest = await (await fetch('prototype-manifest.json', { cache: 'no-store' })).json(); }
  catch (e) { root.append(h('div', { 'class': 'bg-error', role: 'alert' }, 'Nie można wczytać assets/fixtures.json lub prototype-manifest.json — uruchom przez lokalny serwer HTTP (README.md).')); return; }
  var lang = 'default';
  var cq = new URLSearchParams(location.search);
  var ctg = manifest.targets.filter(function (t) { return t.target_id === cq.get('target'); })[0] || manifest.targets.filter(function (t) { return t.target_id === 'mac-wide'; })[0];
  var cUrl = function (t) { var u = new URLSearchParams(); u.set('target', t); return '?' + u.toString(); };
  if (cq.get('target') !== ctg.target_id) history.replaceState(null, '', cUrl(ctg.target_id));
  root.style.maxWidth = Math.min(1240, ctg.width) + 'px';
  if (ctg.width < 1240) root.classList.add('is-framed');
  if (ctg.width < 900) root.classList.add('is-narrow');
  var cbar = BG.previewToolbar({
    catalogHref: cUrl(ctg.target_id), catalogCurrent: true,
    backHref: 'index.html?mode=user_preview&state=' + encodeURIComponent(manifest.states[0].state_id) + '&target=' + encodeURIComponent(ctg.target_id),
    targetId: ctg.target_id, noteStateId: 'catalog', targets: manifest.targets,
    onTarget: function (t) { location.search = cUrl(t); }
  });
  document.body.append(cbar);
  var cfit = function () { document.body.style.paddingBottom = cbar.offsetHeight + 'px'; };
  cfit(); window.addEventListener('resize', cfit);
  if (window.ResizeObserver) new ResizeObserver(cfit).observe(cbar);
  await BG.preload();

  function spm(label, note, node, opts) {
    opts = opts || {};
    return h('div', { 'class': 'cat-spm' + (opts.wide ? ' cat-wide' : ''), 'data-catalog-variant': label },
      h('div', { 'class': 'cat-spm-box', style: opts.boxStyle || null }, node),
      h('div', { 'class': 'cat-spm-label' }, h('b', {}, label), note || null));
  }
  /* r5: przycisk „Odtwórz” przy animacji — narzędzie katalogu (data-prototype-tool), nie UI produktu. */
  function replayBtn(fn, label) {
    return h('button', { type: 'button', 'class': 'cat-replay', 'data-prototype-tool': 'catalog-replay', onclick: fn }, '▶ ' + (label || 'Odtwórz'));
  }
  function spec(rows) { return h('dl', { 'class': 'cat-spec' }, rows.map(function (r) { return [h('dt', { html: r[0] }), h('dd', { html: r[1] })]; })); }
  function table(head, rows) {
    return '<div class="cat-table-wrap"><table class="cat-table"><thead><tr>' + head.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  }
  function section(id, title, sem, specRows, specimens) {
    return h('section', { 'class': 'cat-sec', id: id, 'data-catalog-component': id },
      h('h2', {}, id), h('h3', {}, title), h('p', { 'class': 'cat-sem', html: sem }),
      h('div', { 'class': 'cat-grid' }, spec(specRows), h('div', { 'class': 'cat-specimens' }, specimens)));
  }
  function geoCell(cell) { var gap = 3, pad = 6; return { cell: cell, gap: gap, pad: pad, boardW: 8 * cell + 9 * gap + 2 * pad }; }
  function cellBox(o, size) { var w = h('div', { style: { '--cell': (size || 52) + 'px', position: 'relative' } }, BG.cell(o)); return w; }
  var narrow = ctg.width < 900;
  var specCell = narrow ? 26 : 30;

  function render() {
    var fx = fixtures.fixtures[lang], S = fx.strings, loc = fx.locale, C = fx.catalog;
    document.documentElement.lang = loc;
    root.replaceChildren();
    root.append(h('header', { 'class': 'cat-head' },
      h('div', {}, h('h1', {}, 'Bloomgrid — katalog komponentów'),
        h('p', {}, 'Rewizja r6 (Q147–Q153, Q175, Q176, Q184, Q185): poziomy gry klasycznej — krąg sześciu motywów tła, etykieta poziomu w nagłówku, plakietka awansu i przenikanie tła, poziom w panelu końca; bez stuknij-stuknij (Q185); przycisk „' + S.to_home + '” w panelu końca (Q184); stany po ruchu bez ramki czyszczenia; deszcz płatków przez całą wysokość karty. Z r5 (Q128–Q143, Q162): krok końca gry z komunikatem i oznaczeniem trójki, panel końca z powodem i różnicą do rekordu, przełącznik dźwięku, animacje z przyciskami „Odtwórz” (foundation.motion). Z r4 (Q111–Q114): tekst wyśrodkowany w poziomie wszędzie; na mac-wide wspólna siatka (przycisk domu i rekord na krawędziach planszy i tacki, wynik, seria i punkty na osi środkowego slotu), większy przycisk domu i rekord; sloty tacki bez szwów. Z r3: nowy wygląd z grafik rastrowych (Q96, Q102–Q106) — kafle z kwiatami, drewniana skrzynia planszy, przyciski i panele z obrazów, trzy ilustrowane tła sceny. Zachowanie, układ, stany, komponenty i publiczne ID bez zmian względem r2. Każdy komponent pokazuje przeznaczenie, warianty, konfiguracje, stany interakcji, rolę i nazwę dostępną, kontrakt akcji (action → expected_effect) w każdym kontekście oraz różnice responsywne. Okazy renderuje ten sam runtime co index.html (assets/bloomgrid-ui.js, reguły w assets/bloomgrid-rules.js). Teksty z fixture „' + lang + '”.')),
      h('div', { 'class': 'cat-tools', 'data-prototype-tool': 'catalog-fixture' }, 'fixture:',
        ['default', 'english'].map(function (f) { return h('button', { type: 'button', 'aria-pressed': f === lang ? 'true' : 'false', onclick: function () { lang = f; render(); } }, f); }))));
    var ids = ['foundation.palette', 'component.board-cell', 'component.board', 'component.piece', 'component.piece-tray', 'component.score-display', 'component.combo-badge', 'component.move-points', 'component.mode-label', 'component.level-label', 'component.level-up-badge', 'component.icon-button', 'component.menu-button', 'component.button', 'component.wordmark', 'component.dialog', 'component.game-over-panel', 'component.alert', 'component.sound-toggle', 'component.no-moves-step', 'foundation.motion', 'responsive', 'states-plan'];
    root.append(h('nav', { 'class': 'cat-toc' }, ids.map(function (i) { return h('a', { href: '#' + i }, i); })));

    /* Podstawy: kolory i symbole */
    var colorRows = [['poppy', 'mak — 4 szerokie okrągłe płatki, ciemny środek', '#D44624', '3,84', '#D91D08', 'tile-poppy'], ['sun', 'słonecznik — wieniec wąskich płatków, duży brązowy środek', '#F4BB3D', '9,81', '#D89F2E', 'tile-sun'], ['leaf', 'koniczyna — 4 liście w kształcie serca', '#22A663', '5,47', '#0DA86F', 'tile-leaf'], ['drop', 'chaber — kolczasta gwiazda płatków', '#3C74C3', '3,65', '#4770C4', 'tile-drop'], ['berry', 'kwiat wiśni — kwiaty o 5 płatkach z wcięciem', '#E1339C', '4,21', '#B743A7', 'tile-berry']];
    root.append(section('foundation.palette', 'Kafle z kwiatami, tła sceny i oprawa',
      'Pięć kolorów klocków (R-1.3), każdy z własnym kwiatem na każdym polu, na planszy i w trójce (R-1.9, Q27, Q103). Kwiat, a nie barwa, jest pierwszym rozróżnieniem: kolory dają się odróżnić bez widzenia barw (WCAG 1.4.1); para mak–kwiat wiśni różni się sylwetką (4 okrągłe płatki z ciemnym środkiem kontra gromada kwiatów o 5 płatkach z wcięciem). Klucze kolorów w kodzie i DOM (<code>data-color</code>) bez zmian. Jeden jasny wygląd niezależnie od trybu ciemnego systemu (Q32, Q101).',
      [['Kolory i kwiaty (Q103)', table(['klucz', 'kwiat', 'lico : puste'], colorRows.map(function (r) { return ['<code>' + r[0] + '</code>', r[1], '<code>' + r[2] + '</code> ' + r[3] + ':1']; })) + '<p>Obrazy: <code>assets/img/tile-&lt;klucz&gt;.webp</code>, mały kafel <code>tile-&lt;klucz&gt;-s.webp</code>. Lico = mediana obrazu poza kwiatem.</p>'],
       ['Kontrola dostępności (Q99, Q102)', 'Puste pole: obraz wgłębienia w ziemi przyciemniony do 62% (mediana <code>#2F140B</code>); lico każdego kafla ma z nim ≥ 3:1 (najmniej chaber 3,65). Symulacja Machado 2009 (pełne nasilenie), najmniejsza różnica par ΔE76 lica: protanopia 14,4 (chaber–wiśnia), deuteranopia 30,0, tritanopia 17,6 (mak–wiśnia); kwiatów: 18,2 / 17,7 / 25,6. Mak–kwiat wiśni: lico 71,2 / 62,2 / 17,6, kwiat 49,2 / 41,2 / 59,1. Kontur kwiatu na najjaśniejszym połysku ≥ 3,7:1. Kafel koniczyny ma przesunięty odcień (szmaragd zamiast limonki), bo limonka zlewała się ze słonecznikiem przy protanopii (ΔE 8,8).'],
       ['Mały rozmiar (Q102)', 'W trójce (pole 15–20 px) kafel uproszczony: jeden duży kwiat z grubym konturem, bez drobnych płatków i iskier (<code>assets/img/tile-*-s.webp</code>). Plansza (pole ≥ 36 px) i przeciągany klocek używają pełnego kafla.'],
       ['Tła sceny (Q98, Q104)', 'Trzy ilustracje: <code>blossom-wall</code> (mur z kwitnącą wiśnią), <code>garden-dusk</code> (ogród o zmierzchu z latarniami), <code>hedge</code> (żywopłot z różami). Ekran startowy: zawsze <code>blossom-wall</code>. Gra klasyczna: tło losowane przy każdej nowej grze (w prototypie wynik losowania zapisany w scenariuszu stanu). Wyzwanie dnia: tło z daty ciągu — numer dnia od 1970-01-01 modulo 3 w kolejności blossom-wall, garden-dusk, hedge (10 listopada 2026: <code>garden-dusk</code>). Kadr 9:16 dla powierzchni wyższej niż szeroka, 16:9 dla pozostałych; cover, zakotwiczenie u dołu.'],
       ['Krąg motywów poziomów (r6, Q147, Q148)', 'Sześć teł w stałej kolejności, dzienne i wieczorne na przemian: ' + BG.CIRCLE.map(function (b, i) { return (i + 1) + '. <code>' + b + '</code> „' + S.motifs[b] + '”'; }).join(', ') + '. Nowe: <code>lily-pond</code> (staw z liliami wodnymi, poranek), <code>dawn-meadow</code> (łąka o świcie z makami i rumiankami), <code>firefly-night</code> (nocny ogród ze świetlikami i świecącymi grzybami). Gra klasyczna zaczyna na losowym motywie kręgu (motyw poziomu 1); każdy awans przechodzi do następnego motywu, po szóstym znów pierwszy. Poziom n ma motyw <code>CIRCLE[(start + n − 1) mod 6]</code>. Ekran startowy i wyzwanie dnia bez zmian (R-5.4: <code>blossom-wall</code> i data modulo 3 z trzech pierwotnych teł); wyzwanie dnia nie ma poziomów.'],
       ['Oprawa', 'Plansza to drewniana skrzynia z mosiężnymi gwoździami (<code>assets/img/board-frame.webp</code>, border-image wychodzący 8 / 10 px poza planszę), ziemia <code>#5E321B</code> między polami. Przyciski, sloty trójki, karta dialogu, plakietka serii, plakietka „×2” i przycisk wyjścia to obrazy z tego samego zestawu. Tekst na tle sceny leży na kremowej tabliczce (<code>rgba(255,246,226,.92)</code>, tekst <code>#2A1C10</code>). Czcionka systemowa zaokrąglona (<code>ui-rounded</code>, fallback system-ui), cyfry o stałej szerokości.'],
       ['Ruch (r5)', 'Animacje tylko po interakcji, opis i przyciski „Odtwórz” w sekcji <a href="#foundation.motion">foundation.motion</a>. W <code>mode=capture</code> stany pokazują jedną stałą klatkę.']],
      [spm('5 kolorów', 'pole 56 px', h('div', { 'class': 'cat-cellrow' }, BGRules.COLORS.map(function (c) {
        return h('div', { 'class': 'cat-swatch' }, cellBox({ elementId: 'catalog.palette.' + c, color: c }, 56), h('span', {}, h('code', {}, c)), h('span', {}, S.colors[c]));
      }))),
       spm('skala szarości', 'kontrola bez barw', h('div', { 'class': 'cat-cellrow', style: { filter: 'grayscale(1)' } }, BGRules.COLORS.map(function (c) { return cellBox({ elementId: 'catalog.palette.gray.' + c, color: c }, 44); }))),
       spm('pole 15 px', 'najmniejszy rozmiar (trójka, mobile-compact): kafel uproszczony', h('div', { 'class': 'cat-cellrow bg-small-tiles' }, BGRules.COLORS.map(function (c) { return cellBox({ elementId: 'catalog.palette.small.' + c, color: c }, 15); }))),
       spm('tła sceny — krąg motywów (r6)', 'kolejność kręgu poziomów; kadr 9:16 i 16:9', h('div', { 'class': 'cat-cellrow' }, BG.CIRCLE.map(function (b) {
         return h('div', { 'class': 'cat-swatch' }, h('div', { style: { display: 'flex', gap: '6px' } },
           h('div', { style: { width: '54px', height: '96px', borderRadius: '6px', background: 'url(assets/img/bg-' + b + '-phone.webp) center/cover' } }),
           h('div', { style: { width: '128px', height: '72px', borderRadius: '6px', background: 'url(assets/img/bg-' + b + '-desktop.webp) center/cover' } })), h('span', {}, h('code', {}, b)), h('span', {}, S.motifs[b]));
       })))]));

    /* component.board-cell */
    var pb = { 'class': 'cat-cellrow' };
    root.append(section('component.board-cell', 'Pole planszy',
      'Jedno z 64 pól planszy; ta sama oprawa rysuje pola klocka. Pole samo nie ma akcji — gest przyjmuje <code>component.piece</code>. Podświetlenia opisują skutek położenia trzymanego klocka (R-1.4).',
      [['Warianty', '<ul><li><code>empty</code> — puste: wgłębienie w ziemi (<code>assets/img/cell-empty.webp</code>, przyciemnione do 62%)</li><li><code>filled</code> × 5 kolorów (<code>data-color</code>) — błyszczący kafel z kwiatem koloru (<code>assets/img/tile-&lt;color&gt;.webp</code>; w trójce wersja uproszczona <code>-s</code>)</li></ul>'],
       ['Modyfikatory podglądu', '<ul><li><code>preview=place</code> — pole, które zajmie trzymany klocek: kafel klocka przykryty 45% koloru pustego pola, biała obwódka 2 px</li><li><code>line=clear</code> — pole linii, którą położenie wyczyści: jasna zasłona i podwójna obwódka ciągła (jasna <code>#FFF1B8</code> 2 px + ciemna <code>#1A1008</code> 1 px, ≥ 4:1 na każdym polu)</li><li><code>line=bonus</code> — pole linii jednego koloru (premia R-2.4): ukośne białe paski i przerywana jasna obwódka na ciemnym pasie; plakietka „' + S.bonus_badge + '” (złota moneta) leży poza polami (<code>component.board</code>, Q59); wyróżnienie nie tylko kolorem (Q25)</li><li><code>clearing</code> — czyszczenie po położeniu: jasny błysk i zmniejszanie do zera (320 ms); w capture stała klatka: rozjaśniony kafel, skala 0,86</li></ul>'],
       ['Konfiguracje', 'Rozmiar <code>--cell</code>; kafel wypełnia pole (narożniki przezroczyste); puste pole zaokrąglone 20% boku. Pole na przecięciu czyszczonego rzędu i kolumny należy do obu linii (R-1.6) — wariant <code>bonus</code> ma pierwszeństwo przed <code>clear</code>.'],
       ['Stany interakcji', 'Brak (pole nie jest fokusowalne ani klikalne).'],
       ['Rola i nazwa dostępna', 'Brak własnej roli; stan planszy opisuje nazwa <code>component.board</code>.'],

    function miniBoard(id, rows) {
      var g = geoCell(narrow ? 22 : 26), b = BG.board({ geo: g, S: S, elementId: id, elementPrefix: id + '.' });
      b._rows = rows; b.render(BGRules.parseBoard(rows), {});

    function moveDemo(id, rows, slotPiece, r, c, label) {
      var b = miniBoard(id, rows), st0 = { board: BGRules.parseBoard(rows), tray: [slotPiece, null, null], score: 4210, combo: 1, dry: 0 };
      var sc = BG.scoreDisplay({ variant: 'score', label: S.score, value: 4210, loc: loc, elementId: id + '.score' });
      sc.el.style.setProperty('--score-fs', '30px');
      var strip = h('div', { 'class': 'cat-strip' });
      var praiseHost = b.el;
      var play = function () {
        var res = BGRules.play(st0, 0, r, c, BGRules.rng(7)), mv = res.move, red = BG.fx.reduced();
        b.render(BGRules.parseBoard(rows), {});
        setTimeout(function () {
          b.render(res.state.board, {});
          var cleared = {}; mv.clearedCells.forEach(function (i) { cleared[i] = true; });
          BG.fx.settle(mv.cells.filter(function (i) { return !cleared[i]; }).map(function (i) { return b.cells[i]; }), red);
          var mono = mv.lines.filter(function (l) { return l.mono; });
          if (mv.clearedCells.length) BG.fx.bloom(b, mv.clearedCells, function (i) { return mv.placedBoard[i]; }, red, mono.length ? BG.MOTION.mono : BG.MOTION.bloom);
          mono.forEach(function (l) { BG.fx.sweep(b, l, S, red); });
          if (mv.points.cleared >= 2) BG.fx.praise(praiseHost, BG.praise({ S: S, lines: mv.points.cleared, elementId: id + '.praise' }), red);
          BG.fx.countUp(sc, 4210, 4210 + mv.points.total, red);
          strip.replaceChildren();
          var cb = BG.comboBadge({ c: 2, S: S, elementId: id + '.combo' }); if (cb) { strip.append(cb); BG.fx.pop(cb, red); }
          var mp = BG.movePoints({ points: mv.points, S: S, loc: loc, elementId: id + '.points' }); if (mp) { strip.append(mp); if (red) BG.fx.fade(mp); else BG.fx.play(mp, 'fx-rise', 300); }
        }, 250);
      };
      return h('div', {}, h('div', { 'class': 'cat-stack', style: { alignItems: 'center' } }, sc.el, strip, b.el), replayBtn(play, label));
    }
